pdf_renamer:
  pdf_dir: data/input              # PDF 文件存放目录
  rate_limit_sleep: 0.34            # API 请求间隔（秒）
  api_timeout: 10                   # 请求超时（秒）
  user_agent: "PDFRenamerBot/1.0 (mailto:bemlabapi@163.com)"  # API User-Agent
  log_level: INFO
  retry_times: 2

llms:

  deepseek_pdf_screening:  # 预筛选LLM
    paths:
      input_folder: data/input # PDF 文件存放目录（重命名后）
      in-out_folder: data/in-out/pdf_text
      output_folder: data/output
      output_csv: data/output/prescreening_results_deepseek.csv
    prompt:
      template: LLMprompt/as_prescreening_prompt.md
    model:
      base_url: https://api.deepseek.com
      name: deepseek-v4-pro
      api_key_env: DEEPSEEK_API_KEY
      timeout: 300
    settings:
      max_workers: 3


  pdf_screening: # 预筛选LLM
    targe_property: viscosity # 目标物性 
    paths:
      input_folder: data/input # PDF 文件存放目录（重命名后）
      in-out_folder: data/in-out
      output_folder: data/output
      output_csv: data/output/prescreening_results.csv
    prompt:
      template: LLMprompt/prompt.md
    model:
      base_url: https://dashscope.aliyuncs.com/compatible-mode/v1
      name: qwen-long
      api_key_env: QWEN_API_KEY
      timeout: 300
    settings:
      max_workers: 3
  
  data_extraction:
    paths:
      input_folder: data/in-out/has_data_pdfs
      output_folder: data/in-out
    schema:
      template: LLMprompt/extraction_schema.json
    model:
      # base_url: 
      parse_model_name: dpt-2-latest
      extract_model_name : extract-latest
      api_key_env: VISION_AGENT_API_KEY

pdf_selector:
  pdf_input_dir: data/input
  screening_result: data/output/prescreening_results.csv
  pdf_output_dir: data/in-out/has_data_pdfs

json_filter:
  json_input_dir : data/in-out/_01_extracted
  targe_property : viscosity
  condition_vars : ['temperature']
  json_output_dir : data/in-out/_02_filtered

visualizer:
  pdf_files_dir : data/in-out/has_data_pdfs
  parsed_json_dir : data/in-out/_00_parsed
  filtered_json_dir : data/in-out/_02_filtered
  revised_json_dir  : data/in-out/_03_revised

json_to_table:
  targe_property : viscosity
  json_files_dir : data/in-out/_02_filtered
  table_dir : data/output