# viscosity
pdf_renamer: # 按规则，重命名PDF
  pdf_pool_dir: data/pdf-pool   
  pdf_dir: data/input              # PDF 文件存放目录
  rate_limit_sleep: 0.34            # API 请求间隔（秒）
  api_timeout: 10                   # 请求超时（秒）
  user_agent: "PDFRenamerBot/1.0 (mailto:bemlabapi@163.com)"  # API User-Agent
  log_level: INFO
  retry_times: 2

llms:
  as_extraction:  # 提取DES的应用场景（application scenario）
    paths: # 掌管输入、输出以及中间文件的路径
      input_folder: data/input # PDF 文件存放目录
      in-out_folder: data/in-out/as_extraction_pdf_text # ds大模型不支持PDF直接上传，因此要先提取为text格式
      output_csv: data/output/as_extraction_results.csv
    prompt: # 掌管大模型提示词路径
      template: LLMprompt/as_extraction_prompt.md
    model: # 掌管api参数
      base_url: https://api.deepseek.com
      name: deepseek-v4-pro
      api_key_env: DEEPSEEK_API_KEY
      timeout: 300
    settings: # 掌管并发参数
      max_workers: 3

  si_screening: 
    targe_property: 
    paths:
      input_folder: data/input 
      in-out_folder: data/in-out
      output_csv: data/output/si_screening_results.csv
    prompt:
      template: LLMprompt/si_screening_prompt.md
    model:
      base_url: https://dashscope.aliyuncs.com/compatible-mode/v1
      name: qwen-long
      api_key_env: QWEN_API_KEY
      timeout: 300
    settings:
      max_workers: 3

  main_screening: # 正文是否有数据？
    targe_property: 
    paths:
      input_folder: data/input
      in-out_folder: data/in-out
      output_csv: data/output/main_screening_results.csv
    prompt:
      template: LLMprompt/main_screening_prompt.md
    model:
      base_url: https://dashscope.aliyuncs.com/compatible-mode/v1
      name: qwen-long
      api_key_env: QWEN_API_KEY
      timeout: 300
    settings:
      max_workers: 3

  data_extraction:
    paths:
      input_folder: data/in-out/pdfs_for_extraction
      output_folder: data/in-out/lading-ai_extraction
    schema:
      template: LLMprompt/extraction_schema.json
    model:
      # base_url: 
      parse_model_name: dpt-2-latest
      extract_model_name : extract-latest
      api_key_env: VISION_AGENT_API_KEY

main_selector:
  pdf_input_dir: data/input
  main_screening_result: data/output/main_screening_results.csv
  pdf_output_dir: data/in-out/pdfs_for_extraction

si_selector:
  pdf_input_dir: data/input
  si_screening_result: data/output/si_screening_results.csv
  pdf_output_dir: data/in-out/si_has_data

json_filter:
  json_input_dir : data/in-out/lading-ai_extraction/_01_extracted
  targe_property : viscosity            # 新结构物性为纯数值，须与 des_entries 内键名一致（可选 alpha / beta / pi_star/ viscosity）
  condition_vars : ['temperature']               # 新结构无温度等环境条件字段，置空（如有则填列名）
  json_output_dir : data/in-out/lading-ai_extraction/_02_filtered

visualizer:
  pdf_files_dir : data/in-out/pdfs_for_extraction
  parsed_json_dir : data/in-out/lading-ai_extraction/_00_parsed
  filtered_json_dir : data/in-out/lading-ai_extraction/_02_filtered
  revised_json_dir  : data/in-out/lading-ai_extraction/_03_revised

json_to_table:
  targe_property : viscosity           # 须与 json_filter.targe_property 一致
  condition_vars : ['temperature']               # 须与 json_filter.condition_vars 一致；标量只出值列，[值,单位]/{value,unit} 额外出 <字段>_unit 列
  json_files_dir : data/in-out/lading-ai_extraction/_02_filtered
  table_dir : data/output

table_clean:
  targe_property: viscosity           # 须与 json_to_table.targe_property 一致；无单位物性的归一化会自动跳过
  input_dir: data/output
  output_dir: data/output
  unit_mappings_file: configs/unit_mappings.yaml
